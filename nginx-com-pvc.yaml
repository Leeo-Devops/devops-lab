apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-web
  template:
    metadata:
      labels:
        app: nginx-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        volumeMounts:
        - name: dados-persistentes
          mountPath: /usr/share/nginx/html
      volumes:
      - name: dados-persistentes
        persistentVolumeClaim:
          claimName: nginx-pvc
